name: CI

on:
  push:
  pull_request:

jobs:
  root:
    name: root — build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install root deps
        run: npm ci
      - name: Build TypeScript
        run: npm run build
      - name: Test
        run: npm test

  web:
    name: web — build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web deps
        run: npm ci
      - name: Test
        run: npm test
      - name: Build Next.js
        run: npm run build
