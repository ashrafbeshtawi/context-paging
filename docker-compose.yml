services:
  postgres:
    image: postgres:16-alpine
    container_name: context-paging-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-context_paging}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-context_paging}
      POSTGRES_DB: ${PG_DATABASE:-context_paging}
    ports:
      - "${PG_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-context_paging} -d ${PG_DATABASE:-context_paging}"]
      interval: 3s
      timeout: 3s
      retries: 20

  flyway:
    image: flyway/flyway:10-alpine
    container_name: context-paging-flyway
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${PG_DATABASE:-context_paging}
      FLYWAY_USER: ${PG_USER:-context_paging}
      FLYWAY_PASSWORD: ${PG_PASSWORD:-context_paging}
      FLYWAY_CONNECT_RETRIES: "30"
    volumes:
      - ./migrations:/flyway/sql:ro
    command: ["migrate"]

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: context-paging-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_USER: ${PG_USER:-context_paging}
      PG_PASSWORD: ${PG_PASSWORD:-context_paging}
      PG_DATABASE: ${PG_DATABASE:-context_paging}
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      AI_MODEL: ${AI_MODEL:-}
      # Server-side fallback keys; the web UI can also supply a key
      # per-request from the browser (Settings modal).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      AZURE_API_KEY: ${AZURE_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  postgres-data:
    name: context-paging-postgres-data
